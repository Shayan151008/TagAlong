name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build release APK
        run: bash setup.sh

      - name: Collect APK
        run: cp ../tagalong_app/build/app/outputs/flutter-apk/app-release.apk tagalong.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tagalong-apk
          path: tagalong.apk
